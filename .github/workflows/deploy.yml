
name: Deploy Emotion Diary to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: emotion-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emotion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --runInBand

  deploy:
    name: Build and Deploy
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: emotion-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emotion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx nx build emotion-diary --base-href /emotion-app/
        env:
          NX_DAEMON: "false"
          NX_SKIP_NX_CACHE: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: emotion-app/dist/apps/emotion-diary/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
