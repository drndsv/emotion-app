image: node:22-alpine

stages:
  - validate
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .nx/cache/

before_script:
  - npm ci
  - npx nx --version

lint:
  stage: validate
  script:
    - npm run lint

test:
  stage: validate
  script:
    - npm run test:coverage
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

build:
  stage: build
  script:
    - npx nx build emotion-diary --base-href /$CI_PROJECT_NAME/
  artifacts:
    paths:
      - dist/apps/emotion-diary/browser
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - build
  script:
    - mkdir public
    - cp -r dist/apps/emotion-diary/browser/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "homework"'
