image: node:22-alpine

stages:
  - validate
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: validate
  script:
    - npm run lint

test:
  stage: validate
  script:
    - npm run test

build:
  stage: build
  script:
    - npx nx build emotion-diary --base-href /$CI_PROJECT_NAME/
  artifacts:
    paths:
      - dist/apps/emotion-diary/browser
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - build
  script:
    - mkdir public
    - cp -r dist/apps/emotion-diary/browser/* public/
  artifacts:
    paths:
      - public
  only:
    - homework
